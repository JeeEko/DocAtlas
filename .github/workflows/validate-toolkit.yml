name: Validate DocAtlas toolkit

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install MCP dependencies
        run: npm install --prefix packages/mcp

      - name: Check required files
        run: |
          test -f package.json
          test -f bin/docatlas.js
          test -f lib/init.js
          test -f lib/search.js
          test -f packages/mcp/src/index.js
          test -f templates/docs/ONBOARDING.md
          echo "Required files OK"

      - name: Test parser coverage (>= 90%)
        run: node scripts/test-parsers.mjs

      - name: Test search and health
        run: |
          node scripts/test-search.mjs
          node scripts/test-health.mjs

      - name: Test docatlas init on temp project
        run: |
          mkdir -p /tmp/test-app
          echo '{"name":"test-app","description":"A test app","scripts":{"dev":"node index.js","test":"echo ok"}}' > /tmp/test-app/package.json
          echo '# Test App\n\n## Quick start\n\n```bash\nnpm install\nnpm run dev\n```' > /tmp/test-app/README.md
          node bin/docatlas.js init /tmp/test-app --force
          test -f /tmp/test-app/doc-atlas/docs/START_HERE.md
          test -f /tmp/test-app/doc-atlas/.docatlas.json
          test -f /tmp/test-app/.cursor/commands/docatlas.md
          test -f /tmp/test-app/.cursor/skills/docatlas-skill-discovery/SKILL.md
          test -f /tmp/test-app/doc-atlas/docs/business/CONTEXT-MAP.md
          test -f /tmp/test-app/doc-atlas/docs/AI_CONTEXT.md
          test -f /tmp/test-app/.cursor/skills/docatlas-skill-update/SKILL.md
          test -f /tmp/test-app/.cursor/agents/docatlas-docs-lookup.md
          node scripts/test-business-contexts.mjs
          node scripts/test-freshness.mjs
          node bin/docatlas.js doctor /tmp/test-app
          node bin/docatlas.js doctor /tmp/test-app --score
          node bin/docatlas.js query /tmp/test-app "test app"
          node bin/docatlas.js drift /tmp/test-app

      - name: Compile Explorer
        run: |
          npm install --prefix packages/explorer
          npm run compile --prefix packages/explorer

      - name: Verify VERSION
        run: |
          V=$(cat VERSION | tr -d '[:space:]')
          node -e "const p=require('./package.json'); if(p.version!=='$V') process.exit(1)"
          echo "Version $V OK"
