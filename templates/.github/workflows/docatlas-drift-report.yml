name: DocAtlas drift report

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.mdc'
      - 'src/**'
      - 'lib/**'
      - 'app/**'
      - 'doc-atlas/**'
      - '.docatlas.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for DocAtlas
        id: check
        run: |
          if [[ -f doc-atlas/.docatlas.json || -f .docatlas.json || -f AGENTS.md ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run drift check
        if: steps.check.outputs.present == 'true'
        run: |
          if command -v docatlas >/dev/null 2>&1; then
            docatlas drift --strict
          else
            npm install -g github:JeeEko/DocAtlas
            docatlas drift --strict
          fi

      - name: Skip (DocAtlas not bootstrapped)
        if: steps.check.outputs.present != 'true'
        run: echo "DocAtlas not detected — skipping drift check"
